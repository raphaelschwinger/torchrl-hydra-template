# BBF — Bigger, Better, Faster (Schwarzer et al. 2023), https://arxiv.org/abs/2305.19452
# Defaults follow the official release (google-research/bigger_better_faster,
# configs/BBF.gin) at replay_ratio=2. The paper's flagship result uses
# replay_ratio=8 + reset_interval=40_000 — see
# configs/experiment/bbf/atari100k_rr8.yaml.
# Same class hand-writes C51 and reuses a torchrl PrioritizedSliceSampler buffer;
# see src/algorithms/bbf/bbf.py.
_target_: src.algorithms.bbf.BBFAlgorithm

# Pixel observations: read obs from the "pixels" tensordict key.
obs_key: pixels

# Network ("Bigger"): Impala-CNN ResNet at 4x width, 2048-d head.
width_scale: 4
hidden_dim: 2048
num_atoms: 51
v_min: -10.0
v_max: 10.0
renormalize_latent: true

# Optimisation
lr: 1.0e-4
weight_decay: 0.1
adam_eps: 1.5e-4
batch_size: 32
max_grad_norm: null        # official BBF does not clip gradients

# Update rule
replay_ratio: 2            # gradient steps per env step
max_update_horizon: 10     # n-step annealed 10 -> 3 after each reset
min_update_horizon: 3
min_gamma: 0.97            # discount annealed 0.97 -> 0.997
max_gamma: 0.997
cycle_steps: 10_000        # anneal window (gradient steps)
double_dqn: true
dueling: true

# SPR auxiliary loss
spr_weight: 5.0
spr_depth: 5

# Periodic shrink-and-perturb resets. The official gin's reset_every=20_000
# counts environment steps, i.e. 40k gradient steps at RR2 — and the paper
# resets every 40k gradient steps at any replay ratio.
reset_interval: 40_000     # gradient steps
shrink_factor: 0.5
perturb_factor: 0.5
no_resets_after: 0         # gradient steps; 0 = never stop resetting

# EMA target network
target_tau: 0.005

# Replay
# `replay_capacity` is sized to the training budget, so it is set per
# experiment (>= trainer.total_frames keeps the ring from ever wrapping).
prioritized: true
prb_alpha: 0.5             # sampling prop. to (C51 loss)**alpha
prb_beta: 0.5              # importance-sampling exponent

# Augmentation (DrQ random shift + intensity)
data_augmentation: true
aug_pad: 4
intensity_scale: 0.05

# Exploration / collection
eps_start: 1.0
eps_end: 0.0               # greedy after warm-up; distributional net explores
eps_annealing_frames: 2_001
eps_eval: 0.001
min_replay_history: 2_000  # env steps before learning starts
frames_per_batch: 1
max_frames_per_traj: -1
