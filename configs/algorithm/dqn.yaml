defaults:
  # The Q-network is a config group, not an inline block: Hydra merges dicts,
  # so patching `network._target_` from an experiment would leave this option's
  # kwargs behind. Swap the whole option instead —
  # `algorithm/network=nature_dqn` on the CLI, or `override /algorithm/network:`
  # in an experiment.
  - network: mlp_q
  - _self_

_target_: src.algorithms.dqn.DQNAlgorithm

# Callable factories (override via nested configs; requires ``instantiate(cfg.algorithm)``).
replay_buffer:
  _partial_: true
  _target_: torchrl.data.TensorDictReplayBuffer
  storage:
    _target_: torchrl.data.LazyTensorStorage
    max_size: 10_000
    device: cpu

# Optimisation
lr: 2.5e-4
gamma: 0.99
batch_size: 128
max_grad_norm: 10.0

# Exploration (epsilon-greedy, linear anneal in frames)
eps_start: 1.0
eps_end: 0.05
annealing_frames: 250_000

# Data collection
frames_per_batch: 1_000
init_random_frames: 10_000
max_frames_per_traj: -1

# Learning schedule
num_updates: 100         # gradient updates per collector batch
hard_update_freq: 50     # target net <- online every N gradient steps
