defaults:
  # Actor, critic and the optional shared trunk are one config group, not
  # inline blocks: Hydra merges dicts, so patching `actor_network._target_`
  # from an experiment would leave this option's `num_cells` behind. Swap the
  # whole option instead — `algorithm/policy=nature_cnn_categorical` on the
  # CLI, or `override /algorithm/policy:` in an experiment.
  - policy: mlp_normal
  - _self_

_target_: src.algorithms.ppo.PPOAlgorithm

# Defaults mirror cleanRL's ppo_continuous_action.py (MuJoCo/DMC, 1M frames).

# Optimisation
lr: 3.0e-4
adam_eps: 1.0e-5
anneal_lr: true
anneal_frames: ${trainer.total_frames}  # lr reaches 0 at the end of training
gamma: 0.99
gae_lambda: 0.95
num_epochs: 10
mini_batch_size: 64
clip_epsilon: 0.2
clip_value: true          # cleanRL clip_vloss
entropy_coeff: 0.0
critic_coeff: 0.25        # == cleanRL 0.5 (MSE halving) * 0.5 (vf_coef)
loss_critic_type: l2
normalize_advantage: true # per minibatch
max_grad_norm: 0.5
target_kl: null

# Data collection (on-policy: no replay buffer, no warm-up)
frames_per_batch: 2048
max_frames_per_traj: -1
