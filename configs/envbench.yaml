# @package _global_
#
# Root config for the environment-provider throughput sweep.

defaults:
  - _self_
  - paths: default
  - hydra: default
  - study: envthroughput
  - optional local: default

study_name: envthroughput
results_name: throughput

seeds: [0, 1, 2]

warmup_seconds: 2.0
measure_seconds: 10.0
min_iters: 20
max_iters: 200000

quick: false
quick_grid_size: 2
quick_warmup_seconds: 0.3
quick_measure_seconds: 1.0

cell_timeout_seconds: 900
providers_filter: null
