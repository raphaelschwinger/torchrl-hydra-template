# Atari-100k benchmark protocol: gym-wrapper preprocessing (max-and-skip,
# episodic life), no sticky actions, 84x84 grayscale, 4-frame stack.
#
# Switch game with a single override — atari100k_eval.yaml follows
# automatically:
#   python src/train.py experiment=rainbow/atari100k environment.task=Breakout
task: Jamesbond
name: ALE/${environment.task}-v5
# Without the "ALE/" prefix: openrlbenchmark's HNS table is keyed "Jamesbond-v5".
env_id: ${environment.task}-v5
action_repeat: 4                  # MaxAndSkipEnv(skip=4) below
gym_backend: gymnasium
gym_kwargs:
  frame_skip: 1                   # raw ALE frames; MaxAndSkipEnv does the skipping
  repeat_action_probability: 0.0  # Atari-100k protocol: no sticky actions
  disable_env_checker: true
  from_pixels: true
  pixels_only: false
  categorical_action_encoding: false

# Max-and-skip must sit inside EpisodicLifeEnv so life loss is checked after
# each aggregated agent step (not on every raw ALE frame). Soft reset then
# issues one NOOP through max-and-skip before the TorchRL transform stack.
gymnasium_wrappers:
  - _target_: src.environments.atari_wrappers.MaxAndSkipEnv
    skip: 4
  - _target_: src.environments.atari_wrappers.EpisodicLifeEnv

# TorchRL random no-ops, 84x84 grayscale frames stacked 4 deep, and training
# rewards clipped to {-1, 0, 1} (SignTransform, placed after RewardSum so
# logged episode returns stay unclipped).
transforms:
  - _target_: torchrl.envs.NoopResetEnv
    noops: 30
    random: true
  - _target_: torchrl.envs.ToTensorImage
  - _target_: torchrl.envs.GrayScale
  - _target_: torchrl.envs.Resize
    w: 84
    h: 84
  - _target_: torchrl.envs.CatFrames
    N: 4
    dim: -3
  - _target_: torchrl.envs.RewardSum
  - _target_: torchrl.envs.SignTransform
    in_keys: [reward]
  - _target_: torchrl.envs.StepCounter
    max_steps: 27000
