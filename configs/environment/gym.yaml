# Gymnasium state-observation tasks (classic control + MuJoCo).
#
# Switch task with a single override:
#   python src/train.py experiment=dqn/gym environment.task=Acrobot-v1
#   python src/train.py experiment=ddpg/gym environment.task=Ant-v4
task: CartPole-v1
name: ${environment.task}
# Benchmark id logged to W&B (openrlbenchmark matches config.env_id exactly).
env_id: ${environment.task}
action_repeat: 1
gym_backend: gymnasium

# DoubleToFloat casts float64 observation/action specs (MuJoCo) to float32 for
# torch; it is a no-op for tasks that are already float32 (classic control).
# InitTracker writes ``is_init``, which OU noise reads to reset its state at
# episode boundaries.
transforms:
  - _target_: torchrl.envs.transforms.DoubleToFloat
  - _target_: torchrl.envs.transforms.InitTracker
  - _target_: torchrl.envs.transforms.StepCounter
  - _target_: torchrl.envs.transforms.RewardSum
