# @package _global_
# Generic Atari100k Dreamer experiment. Override env_id/environment.name for a
# different game, e.g.:
#   experiment=dreamer/atari100k env_id=hero environment.name=ALE/Hero-v5
defaults:
  - /algorithm/dreamer: 200m
  - override /algorithm: dreamer
  - override /environment: atari_dreamer
  - override /logger: wandb_dreamer
  - _self_

env_id: jamesbond

environment:
  name: ALE/Jamesbond-v5

trainer:
  accelerator: gpu
  devices: [3]
  seed: 42
  total_frames: 1.1e5 # 110k agent steps = 440k game frames; official DreamerV3 trains 10% past the 100k budget (eval/score_* still cut off at 400k frames)
  num_envs: 1
  log_every_n_steps: 1000

env:
  encoder:
    mlp_keys: '$^'
    cnn_keys: 'image'
  decoder:
    mlp_keys: '$^'
    cnn_keys: 'image'
