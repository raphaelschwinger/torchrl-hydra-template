# @package _global_
# SAC on DMC100k (state obs, single GPU): 100k environment steps = 50k agent
# steps at action repeat 2, the FastRL DMC protocol. References at 100k env
# steps: SAC reruns by the TD-MPC2, SimBa and SimbaV2 authors.
# Run another task with: environment.task=walker-walk
defaults:
  - override /algorithm: sac
  - override /environment: dmc
  - override /evaluation: dmc
  - override /trainer: gpu
  - override /logger: wandb
  - _self_

environment:
  task: cheetah-run

trainer:
  seed: 1
  num_envs: 1
  total_frames: 50_000   # agent steps; x action_repeat 2 = 100k env steps

checkpoint:
  enabled: true
  save_every_n_steps: 0
  save_last: true
