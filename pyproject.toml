[project]
name = "torchrl-hydra-template"
version = "0.1.0"
description = "TorchRL + Hydra RL research template"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core deep learning
    "torch>=2.3.0",
    "torchrl>=0.5.0",
    "tensordict>=0.5.0",
    # Config management
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "hydra-colorlog>=1.2.0",
    # Environments
    "gymnasium[classic-control,mujoco]>=0.29.0",
    "dm-control>=1.0.0",  # DeepMind Control Suite (backend: dm_control)
    "ale-py>=0.9.0",
    "autorom[accept-rom-license]>=0.6.1",
    "torchvision>=0.18.0",  # Atari pixel transforms (Resize)
    "opencv-python-headless>=4.8.0",  # AtariPreprocessing (frame resize)
    # Logging
    "wandb[media]>=0.17.0",
    "tensorboard>=2.16.0",
    # Utilities
    "tqdm>=4.66.0",
    # Testing
    "pytest>=8.0.0",
    "pytest-timeout>=2.3.0",
    "dm-control>=1.0.43",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
envs = [
    "shimmy[dm-control]>=2.0",
    "stable-baselines3>=2.9",
    "envpool>=1.2.5; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version >= '3.11'",
]
envsjax = [
    "jax[cuda12]>=0.7; sys_platform == 'linux'",
    "jax>=0.7; sys_platform != 'linux'",
    "mujoco>=3.2",
    "mujoco-mjx>=3.11",
    "playground>=0.2",
]
studies = [
    "pyarrow>=14.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
