# BBF at the paper's flagship replay ratio 8 on the three test Atari-100k
# games, 5 seeds each -- the RR8 counterpart to bbf_atari100k.yaml, with the
# same runtime knobs so the two differ in the replay ratio alone.

common:
  tag: test-atari100k
  seeds: [1, 2, 3, 4, 5]
  total_frames: 100_000
  overrides:
    - exp_name=bbf_rr8_test
    - trainer.num_envs=1
    - trainer.log_every_n_steps=1000
    - algorithm.amp=true
    - algorithm.storage_device=cuda
    - algorithm.cudnn_benchmark=true
    - algorithm.tf32=true
  smoke_overrides:
    - evaluation.every_n_steps=0
    - evaluation.final_num_episodes=2
    - trainer.total_frames=40
    - trainer.log_every_n_steps=8
    - algorithm.min_replay_history=8
    - algorithm.batch_size=2
    - algorithm.replay_ratio=1
    - algorithm.replay_capacity=200
    - algorithm.max_update_horizon=3
    - algorithm.min_update_horizon=1
    - algorithm.spr_depth=2
    - algorithm.width_scale=1
    - algorithm.hidden_dim=64
    - algorithm.reset_interval=12
    - algorithm.eps_annealing_frames=8

runs:
  bbf_rr8_assault:
    experiment: bbf/atari100k_rr8
    overrides: [environment.task=Assault]

  bbf_rr8_bank_heist:
    experiment: bbf/atari100k_rr8
    overrides: [environment.task=BankHeist]

  bbf_rr8_road_runner:
    experiment: bbf/atari100k_rr8
    overrides: [environment.task=RoadRunner]
