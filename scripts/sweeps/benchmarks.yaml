# The template's benchmark sweep: 6 experiments x 3 seeds.
#
#   ./scripts/run_sweep.sh --dry-run     # print the commands
#   ./scripts/run_sweep.sh --smoke       # tiny budgets, validates specs
#   ./scripts/run_sweep.sh               # the real sweep
#
# Read by scripts/jobs.py, which both runners shell out to. A job is an
# experiment plus the overrides that make it this job; seeds are the runner's.

common:
  seeds: [1, 2, 3]
  # Applied to every job under --smoke, before each job's own smoke overrides.
  # Keeps a validation pass to seconds. Smoke runs also carry a `smoke` tag
  # rather than `template` (the runner sets it), so a stray online run can
  # never reach scripts/update_algo_results.py.
  smoke_overrides:
    - evaluation.every_n_steps=0
    - evaluation.final_num_episodes=2
    - checkpoint.enabled=false

runs:
  ppo_atari100k_jamesbond:
    experiment: ppo/ale
    overrides: [environment.task=Jamesbond]
    smoke_overrides:
      - trainer.total_frames=256
      - trainer.num_envs=1
      - trainer.log_every_n_steps=64
      - algorithm.frames_per_batch=64
      - algorithm.mini_batch_size=32
      - algorithm.num_epochs=2
      - algorithm.anneal_frames=256

  bbf_atari100k_jamesbond:
    experiment: bbf/atari100k
    overrides: [environment.task=Jamesbond]
    smoke_overrides:
      - trainer.total_frames=40
      - trainer.log_every_n_steps=8
      - algorithm.min_replay_history=8
      - algorithm.batch_size=2
      - algorithm.replay_ratio=1
      - algorithm.replay_capacity=200
      - algorithm.max_update_horizon=3
      - algorithm.min_update_horizon=1
      - algorithm.spr_depth=2
      - algorithm.width_scale=1
      - algorithm.hidden_dim=64
      - algorithm.reset_interval=12
      - algorithm.eps_annealing_frames=8

  # The Dreamer smoke overrides pull `world_model_video_log_every` down to 8
  # frames on purpose: at the committed 50k cadence a smoke run never reaches
  # the video path, which is exactly how a decoder-key crash on DMC Proprio
  # shipped past a green `--smoke`. The agent video is disabled instead -- it
  # rolls out hundreds of env steps and adds nothing a smoke run needs.
  dreamer_atari100k_jamesbond:
    experiment: dreamer/atari100k
    overrides: [environment.task=Jamesbond]
    smoke_overrides:
      - trainer.total_frames=20
      - trainer.log_every_n_steps=10
      - algorithm.world_model_video_log_every=8
      - algorithm.agent_video_log_every=0
      - model.deter=64
      - model.hidden=64
      - model.discrete=8
      - model.depth=8
      - model.units=64
      - algorithm.buffer_config.batch_size=16
      - algorithm.buffer_config.batch_length=8
      - algorithm.buffer_config.max_size=500
      - algorithm.dreamer_config.compile=false
      - algorithm.dreamer_config.imag_horizon=3

  # `ppo/dmc` still needs accelerator=gpu -- it is the one experiment that does
  # not select `override /trainer: gpu`.
  ppo_dmc_cheetah_run:
    experiment: ppo/dmc
    overrides:
      - environment.task=cheetah-run
      - trainer.accelerator=gpu
    smoke_overrides:
      - trainer.total_frames=256
      - trainer.log_every_n_steps=64
      - algorithm.frames_per_batch=64
      - algorithm.mini_batch_size=32
      - algorithm.num_epochs=2
      - algorithm.anneal_frames=256
      - evaluation.every_n_steps=0

  tdmpc2_dmc_cheetah_run:
    experiment: tdmpc2/dmc
    overrides: [environment.task=cheetah-run]
    smoke_overrides:
      - trainer.total_frames=120
      - trainer.log_every_n_steps=40
      - algorithm.compile=false
      - algorithm.frames_per_batch=40
      - algorithm.init_random_frames=40
      - algorithm.pretrain_updates=1
      - algorithm.num_updates=1
      - algorithm.batch_size=4
      - algorithm.buffer_size=1000
      - algorithm.latent_dim=64
      - algorithm.enc_dim=32
      - algorithm.mlp_dim=32
      - algorithm.num_q=2
      - algorithm.num_samples=32
      - algorithm.num_elites=4
      - algorithm.num_pi_trajs=2
      - algorithm.iterations=1
      - evaluation.every_n_steps=0
      - evaluation.final_num_episodes=1
      - checkpoint.enabled=false

  dreamer_dmc_cheetah_run:
    experiment: dreamer/dmc
    overrides: [environment.task=cheetah-run]
    smoke_overrides:
      - trainer.total_frames=40
      - trainer.log_every_n_steps=10
      - algorithm.world_model_video_log_every=8
      - algorithm.agent_video_log_every=0
      - model.deter=64
      - model.hidden=64
      - model.discrete=8
      - model.units=64
      - algorithm.buffer_config.batch_size=16
      - algorithm.buffer_config.batch_length=8
      - algorithm.buffer_config.max_size=500
      - algorithm.dreamer_config.compile=false
      - algorithm.dreamer_config.imag_horizon=3
      - evaluation.every_n_steps=0
      - evaluation.final_num_episodes=1
