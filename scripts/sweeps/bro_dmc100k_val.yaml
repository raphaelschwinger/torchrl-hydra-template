# BRO (UTD 10) port check on DMC100k (state obs; 100k env steps = 50k agent
# steps at action repeat 2), published settings, six tasks across six domains,
# 3 seeds. Compare per task with the per-seed BRO UTD10 scores at 100k env steps
# rerun by the SimbaV2 authors (FastRL paper repo:
# data/external/dmc/scores_per_seed.csv, from dojeon-ai/SimbaV2 results/baseline).
#
#   ./scripts/run_sweep.sh --sweep scripts/sweeps/bro_dmc100k_val.yaml --gpus 0,1,2,3
common:
  tag: bro-dmc100k-val
  seeds:
  - 1
  - 2
  - 3
  total_frames: 50000
  overrides:
  - trainer.num_envs=1
  - trainer.log_every_n_steps=1000
  - checkpoint.save_every_n_steps=0
  smoke_overrides:
  - trainer.total_frames=300
  - evaluation.every_n_steps=0
  - evaluation.final_num_episodes=1
  - trainer.log_every_n_steps=50
runs:
  bro_cheetah-run:
    experiment: bro/dmc
    overrides:
    - exp_name=bro_verify
    - environment.task=cheetah-run
    smoke_overrides:
    - algorithm.init_random_frames=100
  bro_walker-walk:
    experiment: bro/dmc
    overrides:
    - exp_name=bro_verify
    - environment.task=walker-walk
    smoke_overrides:
    - algorithm.init_random_frames=100
  bro_finger-spin:
    experiment: bro/dmc
    overrides:
    - exp_name=bro_verify
    - environment.task=finger-spin
    smoke_overrides:
    - algorithm.init_random_frames=100
  bro_reacher-easy:
    experiment: bro/dmc
    overrides:
    - exp_name=bro_verify
    - environment.task=reacher-easy
    smoke_overrides:
    - algorithm.init_random_frames=100
  bro_quadruped-walk:
    experiment: bro/dmc
    overrides:
    - exp_name=bro_verify
    - environment.task=quadruped-walk
    smoke_overrides:
    - algorithm.init_random_frames=100
  bro_cartpole-swingup:
    experiment: bro/dmc
    overrides:
    - exp_name=bro_verify
    - environment.task=cartpole-swingup
    smoke_overrides:
    - algorithm.init_random_frames=100
