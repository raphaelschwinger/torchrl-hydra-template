# Per-tweak runtime ablation for BRO (UTD 10) on DMC100k finger-turn_easy (the
# validation task), the counterpart of bbf_/dreamer_optimisations_ablation.yaml.
# BASELINE IS EVERYTHING OFF (the published code path); each row switches one
# knob on and spells out every runtime flag. Rows of BBF/Dreamer that do not
# apply to BRO: channels-last and cuDNN benchmark (no convolutions), uniform
# replay (BRO already samples uniformly), Dreamer's static_pad / dedup_value /
# foreach_laprop. BRO-specific: one CUDA graph per agent step (all 10 updates,
# the official code's fori_loop). 5 seeds per row.
#
# MEASURED SWEEP: wall-clock, run serially on one idle GPU:
#   GPU=0 ./scripts/run_measured_sweep.sh --sweep scripts/sweeps/bro_optimisations_ablation.yaml

common:
  tag: bro-opt5
  seeds: [1, 2, 3, 4, 5]
  total_frames: 50_000
  overrides:
    - environment.task=finger-turn_easy
    - trainer.num_envs=1
    - trainer.log_every_n_steps=1000
    - checkpoint.enabled=false
  smoke_overrides:
    - trainer.total_frames=300
    - evaluation.every_n_steps=0
    - evaluation.final_num_episodes=1
    - trainer.log_every_n_steps=50
    - algorithm.init_random_frames=100

runs:
  baseline:
    label: "Baseline (published BRO, RR 10, all runtime tweaks off)"
    axis: ""
    semantics_preserving: true
    experiment: bro/dmc
    overrides:
      - exp_name=bro_ablation_baseline
      - algorithm.compile=false
      - algorithm.compile_scope=update
      - algorithm.tf32=false
      - algorithm.amp=false
      - algorithm.fused_optim=false
      - algorithm.pin_memory=false
      - algorithm.buffer_device=cpu

  pin_memory:
    label: "Pinned staging + async H2D"
    axis: "data"
    semantics_preserving: true
    experiment: bro/dmc
    overrides:
      - exp_name=bro_ablation_pin_memory
      - algorithm.compile=false
      - algorithm.compile_scope=update
      - algorithm.tf32=false
      - algorithm.amp=false
      - algorithm.fused_optim=false
      - algorithm.pin_memory=true
      - algorithm.buffer_device=cpu

  gpu_replay:
    label: "GPU-resident replay"
    axis: "data"
    semantics_preserving: true
    experiment: bro/dmc
    overrides:
      - exp_name=bro_ablation_gpu_replay
      - algorithm.compile=false
      - algorithm.compile_scope=update
      - algorithm.tf32=false
      - algorithm.amp=false
      - algorithm.fused_optim=false
      - algorithm.pin_memory=false
      - algorithm.buffer_device=cuda

  rr2:
    label: "Replay ratio 10 → 2 (BRO Fast)"
    axis: "data"
    semantics_preserving: false
    experiment: bro/dmc
    overrides:
      - exp_name=bro_ablation_rr2
      - algorithm.compile=false
      - algorithm.compile_scope=update
      - algorithm.tf32=false
      - algorithm.amp=false
      - algorithm.fused_optim=false
      - algorithm.pin_memory=false
      - algorithm.buffer_device=cpu
      - algorithm.num_updates=2

  compile:
    label: "torch.compile (default mode, per update)"
    axis: "network"
    semantics_preserving: true
    experiment: bro/dmc
    overrides:
      - exp_name=bro_ablation_compile
      - algorithm.compile=default
      - algorithm.compile_scope=update
      - algorithm.tf32=false
      - algorithm.amp=false
      - algorithm.fused_optim=false
      - algorithm.pin_memory=false
      - algorithm.buffer_device=cpu

  compile_cg:
    label: "torch.compile reduce-overhead (CUDA graph per update)"
    axis: "network"
    semantics_preserving: true
    experiment: bro/dmc
    overrides:
      - exp_name=bro_ablation_compile_cg
      - algorithm.compile=reduce-overhead
      - algorithm.compile_scope=update
      - algorithm.tf32=false
      - algorithm.amp=false
      - algorithm.fused_optim=false
      - algorithm.pin_memory=false
      - algorithm.buffer_device=cpu

  compile_cg_step:
    label: "CUDA graph per agent step (all 10 updates)"
    axis: "network"
    semantics_preserving: true
    experiment: bro/dmc
    overrides:
      - exp_name=bro_ablation_compile_cg_step
      - algorithm.compile=reduce-overhead
      - algorithm.compile_scope=step
      - algorithm.tf32=false
      - algorithm.amp=false
      - algorithm.fused_optim=false
      - algorithm.pin_memory=false
      - algorithm.buffer_device=cpu

  max_autotune:
    label: "torch.compile max-autotune-no-cudagraphs"
    axis: "network"
    semantics_preserving: true
    experiment: bro/dmc
    overrides:
      - exp_name=bro_ablation_max_autotune
      - algorithm.compile=max-autotune-no-cudagraphs
      - algorithm.compile_scope=update
      - algorithm.tf32=false
      - algorithm.amp=false
      - algorithm.fused_optim=false
      - algorithm.pin_memory=false
      - algorithm.buffer_device=cpu

  amp:
    label: "Mixed precision (bf16)"
    axis: "network"
    semantics_preserving: false
    experiment: bro/dmc
    overrides:
      - exp_name=bro_ablation_amp
      - algorithm.compile=false
      - algorithm.compile_scope=update
      - algorithm.tf32=false
      - algorithm.amp=true
      - algorithm.fused_optim=false
      - algorithm.pin_memory=false
      - algorithm.buffer_device=cpu

  tf32:
    label: "TF32 matmuls"
    axis: "network"
    semantics_preserving: true
    experiment: bro/dmc
    overrides:
      - exp_name=bro_ablation_tf32
      - algorithm.compile=false
      - algorithm.compile_scope=update
      - algorithm.tf32=true
      - algorithm.amp=false
      - algorithm.fused_optim=false
      - algorithm.pin_memory=false
      - algorithm.buffer_device=cpu

  fused_optim:
    label: "Fused AdamW"
    axis: "network"
    semantics_preserving: true
    experiment: bro/dmc
    overrides:
      - exp_name=bro_ablation_fused_optim
      - algorithm.compile=false
      - algorithm.compile_scope=update
      - algorithm.tf32=false
      - algorithm.amp=false
      - algorithm.fused_optim=true
      - algorithm.pin_memory=false
      - algorithm.buffer_device=cpu

  batch256:
    label: "Optimisation batch 128 → 256"
    axis: "network"
    semantics_preserving: false
    experiment: bro/dmc
    overrides:
      - exp_name=bro_ablation_batch256
      - algorithm.compile=false
      - algorithm.compile_scope=update
      - algorithm.tf32=false
      - algorithm.amp=false
      - algorithm.fused_optim=false
      - algorithm.pin_memory=false
      - algorithm.buffer_device=cpu
      - algorithm.batch_size=256

  batch64:
    label: "Optimisation batch 128 → 64"
    axis: "network"
    semantics_preserving: false
    experiment: bro/dmc
    overrides:
      - exp_name=bro_ablation_batch64
      - algorithm.compile=false
      - algorithm.compile_scope=update
      - algorithm.tf32=false
      - algorithm.amp=false
      - algorithm.fused_optim=false
      - algorithm.pin_memory=false
      - algorithm.buffer_device=cpu
      - algorithm.batch_size=64

  combined:
    label: "Combined (CUDA graph per step, TF32, fused AdamW, GPU replay)"
    axis: "combined"
    semantics_preserving: true
    experiment: bro/dmc
    overrides:
      - exp_name=bro_ablation_combined
      - algorithm.compile=reduce-overhead
      - algorithm.compile_scope=step
      - algorithm.tf32=true
      - algorithm.amp=false
      - algorithm.fused_optim=true
      - algorithm.pin_memory=false
      - algorithm.buffer_device=cuda

  combined_amp:
    label: "Combined + bf16"
    axis: "combined"
    semantics_preserving: false
    experiment: bro/dmc
    overrides:
      - exp_name=bro_ablation_combined_amp
      - algorithm.compile=reduce-overhead
      - algorithm.compile_scope=step
      - algorithm.tf32=true
      - algorithm.amp=true
      - algorithm.fused_optim=true
      - algorithm.pin_memory=false
      - algorithm.buffer_device=cuda
