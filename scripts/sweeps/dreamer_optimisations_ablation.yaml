# Per-tweak optimisation ablation for DreamerV3 on the Atari-100k validation
# task: each runtime tweak enabled individually on top of a stock baseline.
#
#   GPU=2 ./scripts/run_measured_sweep.sh --sweep scripts/sweeps/dreamer_optimisations_ablation.yaml
#   GPU=2 ./scripts/run_measured_sweep.sh --sweep scripts/sweeps/dreamer_optimisations_ablation.yaml --only baseline,compile
#
# MEASURED SWEEP: the result is wall-clock, so it is not reproducible off this
# machine. Run it with run_measured_sweep.sh, never run_sweep.sh — a parallel
# neighbour on another card still shares this host's CPU and PCIe.
#
# BASELINE IS EVERYTHING OFF, which is also the committed default. Every row
# still spells out every flag instead of relying on it, so the sweep stays
# valid if a default changes: the baseline switches all off and each row
# switches exactly one back on.
# So a tweak that earns its keep shows up as a NEGATIVE delta.

common:
  # W&B tag for every cell of this sweep, so a run is traceable back to the
  # sweep that produced it rather than to "some measured run with these knobs".
  # `run_measured_sweep.sh --tag NAME` overrides it.
  tag: dreamer-opt
  # One seed by default, because most rows here are pure-runtime: they measure
  # wall-clock, where a second seed buys run-to-run variance rather than a
  # result. Rows whose claim is about SCORE override this with
  # `seeds: [1, 2, 3, 4, 5]` — every `semantics_preserving: false` row, plus
  # `baseline` and `combined`, which those rows are compared against. The one
  # exception is `channels_last_amp_cudnn`, a single debugging run.
  seeds: [1]
  total_frames: 100_000
  overrides:
    - environment.task=Jamesbond
    - checkpoint.enabled=false
    - trainer.log_every_n_steps=1000
    - trainer.num_envs=1
    - algorithm.world_model_video_log_every=0
    - algorithm.agent_video_log_every=0

runs:
  baseline:
    label: "Baseline (all runtime tweaks off)"
    axis: ""
    semantics_preserving: true
    # The reference every other row is quoted against, so it needs the seeds
    # of the most demanding of them.
    seeds: [1, 2, 3, 4, 5]
    experiment: dreamer/atari100k
    overrides:
      - exp_name=dreamer_ablation_baseline
      - algorithm.dreamer_config.compile=false
      - algorithm.dreamer_config.perf.amp=off
      - algorithm.dreamer_config.perf.static_pad=false
      - algorithm.dreamer_config.perf.dedup_value=false
      - algorithm.dreamer_config.perf.cudnn_benchmark=false
      - algorithm.dreamer_config.perf.tf32=false
      - algorithm.dreamer_config.perf.foreach_laprop=false
      - algorithm.dreamer_config.perf.channels_last=false
      - algorithm.buffer_config.pin_memory=false

  # ----------------------------------------------------------------- network
  compile:
    label: "torch.compile"
    axis: network
    semantics_preserving: true
    # `true` = torch.compile's default mode, as in BBF's row. Unlike BBF, only
    # the update step (`_cal_grad`: losses + backward) is compiled; acting
    # (`act`) and the optimiser step stay eager.
    experiment: dreamer/atari100k
    overrides:
      - exp_name=dreamer_ablation_compile
      - algorithm.dreamer_config.compile=true
      - algorithm.dreamer_config.perf.amp=off
      - algorithm.dreamer_config.perf.static_pad=false
      - algorithm.dreamer_config.perf.dedup_value=false
      - algorithm.dreamer_config.perf.cudnn_benchmark=false
      - algorithm.dreamer_config.perf.tf32=false
      - algorithm.dreamer_config.perf.foreach_laprop=false
      - algorithm.dreamer_config.perf.channels_last=false
      - algorithm.buffer_config.pin_memory=false

  max_autotune:
    label: "torch.compile (max-autotune-no-cudagraphs)"
    axis: network
    semantics_preserving: true
    experiment: dreamer/atari100k
    overrides:
      - exp_name=dreamer_ablation_max_autotune_no_graphs
      - algorithm.dreamer_config.compile=max-autotune-no-cudagraphs
      - algorithm.dreamer_config.perf.amp=off
      - algorithm.dreamer_config.perf.static_pad=false
      - algorithm.dreamer_config.perf.dedup_value=false
      - algorithm.dreamer_config.perf.cudnn_benchmark=false
      - algorithm.dreamer_config.perf.tf32=false
      - algorithm.dreamer_config.perf.foreach_laprop=false
      - algorithm.dreamer_config.perf.channels_last=false
      - algorithm.buffer_config.pin_memory=false

  max_autotune_full:
    label: "torch.compile (max-autotune)"
    axis: network
    semantics_preserving: true
    experiment: dreamer/atari100k
    overrides:
      - exp_name=dreamer_ablation_max_autotune
      - algorithm.dreamer_config.compile=max-autotune
      - algorithm.dreamer_config.perf.amp=off
      - algorithm.dreamer_config.perf.static_pad=false
      - algorithm.dreamer_config.perf.dedup_value=false
      - algorithm.dreamer_config.perf.cudnn_benchmark=false
      - algorithm.dreamer_config.perf.tf32=false
      - algorithm.dreamer_config.perf.foreach_laprop=false
      - algorithm.dreamer_config.perf.channels_last=false
      - algorithm.buffer_config.pin_memory=false

  reduce-overhead:
    label: "torch.compile (reduce-overhead)"
    axis: network
    semantics_preserving: true
    experiment: dreamer/atari100k
    overrides:
      - exp_name=dreamer_ablation_reduce_overhead
      - algorithm.dreamer_config.compile=reduce-overhead
      - algorithm.dreamer_config.perf.amp=off
      - algorithm.dreamer_config.perf.static_pad=false
      - algorithm.dreamer_config.perf.dedup_value=false
      - algorithm.dreamer_config.perf.cudnn_benchmark=false
      - algorithm.dreamer_config.perf.tf32=false
      - algorithm.dreamer_config.perf.foreach_laprop=false
      - algorithm.dreamer_config.perf.channels_last=false
      - algorithm.buffer_config.pin_memory=false


  amp_fp16:
    label: "Mixed precision (fp16 + GradScaler)"
    axis: network
    seeds: [1, 2, 3, 4, 5]
    # r2dreamer's scheme: fp16's 5-bit exponent underflows, so the scaling is required.
    semantics_preserving: false
    enabled: false
    experiment: dreamer/atari100k
    overrides:
      - exp_name=dreamer_ablation_amp_fp16
      - algorithm.dreamer_config.compile=false
      - algorithm.dreamer_config.perf.amp=fp16
      - algorithm.dreamer_config.perf.static_pad=false
      - algorithm.dreamer_config.perf.dedup_value=false
      - algorithm.dreamer_config.perf.cudnn_benchmark=false
      - algorithm.dreamer_config.perf.tf32=false
      - algorithm.dreamer_config.perf.foreach_laprop=false
      - algorithm.dreamer_config.perf.channels_last=false
      - algorithm.buffer_config.pin_memory=false

  amp_bf16:
    label: "Mixed precision (bf16)"
    axis: network
    seeds: [1, 2, 3, 4, 5]
    # Official DreamerV3's scheme: bf16 autocast, no gradient scaling.
    semantics_preserving: false
    experiment: dreamer/atari100k
    overrides:
      - exp_name=dreamer_ablation_amp_bf16
      - algorithm.dreamer_config.compile=false
      - algorithm.dreamer_config.perf.amp=bf16
      - algorithm.dreamer_config.perf.static_pad=false
      - algorithm.dreamer_config.perf.dedup_value=false
      - algorithm.dreamer_config.perf.cudnn_benchmark=false
      - algorithm.dreamer_config.perf.tf32=false
      - algorithm.dreamer_config.perf.foreach_laprop=false
      - algorithm.dreamer_config.perf.channels_last=false
      - algorithm.buffer_config.pin_memory=false

  static_pad:
    label: "Static conv padding"
    axis: network
    semantics_preserving: true
    experiment: dreamer/atari100k
    enabled: false
    overrides:
      - exp_name=dreamer_ablation_static_pad
      - algorithm.dreamer_config.compile=false
      - algorithm.dreamer_config.perf.amp=off
      - algorithm.dreamer_config.perf.static_pad=true
      - algorithm.dreamer_config.perf.dedup_value=false
      - algorithm.dreamer_config.perf.cudnn_benchmark=false
      - algorithm.dreamer_config.perf.tf32=false
      - algorithm.dreamer_config.perf.foreach_laprop=false
      - algorithm.dreamer_config.perf.channels_last=false
      - algorithm.buffer_config.pin_memory=false

  channels_last:
    label: "Channels-last"
    axis: network
    semantics_preserving: true
    # Same knob as bbf_optimisations_ablation.yaml's row. Measured with compile
    # off like every other single-tweak row; under compile inductor already
    # lays convs out NHWC, so the gain there is expected to vanish.
    experiment: dreamer/atari100k
    overrides:
      - exp_name=dreamer_ablation_channels_last
      - algorithm.dreamer_config.compile=false
      - algorithm.dreamer_config.perf.amp=off
      - algorithm.dreamer_config.perf.static_pad=false
      - algorithm.dreamer_config.perf.dedup_value=false
      - algorithm.dreamer_config.perf.cudnn_benchmark=false
      - algorithm.dreamer_config.perf.tf32=false
      - algorithm.dreamer_config.perf.foreach_laprop=false
      - algorithm.dreamer_config.perf.channels_last=true
      - algorithm.buffer_config.pin_memory=false

  channels_last_amp_cudnn:
    label: "Channels-last + fp16 + cuDNN benchmark"
    axis: network
    # One debugging run for channels_last, not a result row: checks whether it
    # pays off where cuDNN's NHWC kernels are tuned (fp16 autocast, benchmarked
    # algorithm choice), since the f32 `channels_last` row came out slower than
    # the baseline in the earlier (archived) sweep. Its `amp_fp16` and
    # `cudnn_benchmark` references are disabled, so the gain cannot be split
    # between the three knobs. fp16 changes numerics, hence not
    # semantics-preserving.
    seeds: [1]
    semantics_preserving: false
    experiment: dreamer/atari100k
    overrides:
      - exp_name=dreamer_ablation_channels_last_amp_cudnn
      - algorithm.dreamer_config.compile=false
      - algorithm.dreamer_config.perf.amp=fp16
      - algorithm.dreamer_config.perf.static_pad=false
      - algorithm.dreamer_config.perf.dedup_value=false
      - algorithm.dreamer_config.perf.cudnn_benchmark=true
      - algorithm.dreamer_config.perf.tf32=false
      - algorithm.dreamer_config.perf.foreach_laprop=false
      - algorithm.dreamer_config.perf.channels_last=true
      - algorithm.buffer_config.pin_memory=false

  cudnn_benchmark:
    label: "cuDNN benchmark"
    axis: network
    semantics_preserving: true
    enabled: true
    experiment: dreamer/atari100k
    overrides:
      - exp_name=dreamer_ablation_cudnn_benchmark
      - algorithm.dreamer_config.compile=false
      - algorithm.dreamer_config.perf.amp=off
      - algorithm.dreamer_config.perf.static_pad=false
      - algorithm.dreamer_config.perf.dedup_value=false
      - algorithm.dreamer_config.perf.cudnn_benchmark=true
      - algorithm.dreamer_config.perf.tf32=false
      - algorithm.dreamer_config.perf.foreach_laprop=false
      - algorithm.dreamer_config.perf.channels_last=false
      - algorithm.buffer_config.pin_memory=false

  tf32:
    label: "TF32 matmuls"
    axis: network
    semantics_preserving: true
    enabled: true
    experiment: dreamer/atari100k
    overrides:
      - exp_name=dreamer_ablation_tf32
      - algorithm.dreamer_config.compile=false
      - algorithm.dreamer_config.perf.amp=off
      - algorithm.dreamer_config.perf.static_pad=false
      - algorithm.dreamer_config.perf.dedup_value=false
      - algorithm.dreamer_config.perf.cudnn_benchmark=false
      - algorithm.dreamer_config.perf.tf32=true
      - algorithm.dreamer_config.perf.foreach_laprop=false
      - algorithm.dreamer_config.perf.channels_last=false
      - algorithm.buffer_config.pin_memory=false

  # --------------------------------------------------------------- optimiser
  dedup_value:
    label: "Deduplicated value forward"
    axis: network
    semantics_preserving: true
    enabled: false
    experiment: dreamer/atari100k
    overrides:
      - exp_name=dreamer_ablation_dedup_value
      - algorithm.dreamer_config.compile=false
      - algorithm.dreamer_config.perf.amp=off
      - algorithm.dreamer_config.perf.static_pad=false
      - algorithm.dreamer_config.perf.dedup_value=true
      - algorithm.dreamer_config.perf.cudnn_benchmark=false
      - algorithm.dreamer_config.perf.tf32=false
      - algorithm.dreamer_config.perf.foreach_laprop=false
      - algorithm.dreamer_config.perf.channels_last=false
      - algorithm.buffer_config.pin_memory=false

  foreach_laprop:
    label: "Batched LaProp step"
    axis: network
    semantics_preserving: true
    enabled: false
    experiment: dreamer/atari100k
    overrides:
      - exp_name=dreamer_ablation_foreach_laprop
      - algorithm.dreamer_config.compile=false
      - algorithm.dreamer_config.perf.amp=off
      - algorithm.dreamer_config.perf.static_pad=false
      - algorithm.dreamer_config.perf.dedup_value=false
      - algorithm.dreamer_config.perf.cudnn_benchmark=false
      - algorithm.dreamer_config.perf.tf32=false
      - algorithm.dreamer_config.perf.foreach_laprop=true
      - algorithm.dreamer_config.perf.channels_last=false
      - algorithm.buffer_config.pin_memory=false

  # -------------------------------------------------------------------- data
  pin_memory:
    label: "Pinned staging + async H2D"
    axis: data
    semantics_preserving: true
    experiment: dreamer/atari100k
    overrides:
      - exp_name=dreamer_ablation_pin_memory
      - algorithm.dreamer_config.compile=false
      - algorithm.dreamer_config.perf.amp=off
      - algorithm.dreamer_config.perf.static_pad=false
      - algorithm.dreamer_config.perf.dedup_value=false
      - algorithm.dreamer_config.perf.cudnn_benchmark=false
      - algorithm.dreamer_config.perf.tf32=false
      - algorithm.dreamer_config.perf.foreach_laprop=false
      - algorithm.dreamer_config.perf.channels_last=false
      - algorithm.buffer_config.pin_memory=true

  gpu_replay:
    label: "GPU-resident replay"
    axis: data
    semantics_preserving: true
    # `storage_device: cpu` is already the committed default, so unlike the
    # rows above this one does not appear in the baseline's override list.
    experiment: dreamer/atari100k
    overrides:
      - exp_name=dreamer_ablation_gpu_replay
      - algorithm.dreamer_config.compile=false
      - algorithm.dreamer_config.perf.amp=off
      - algorithm.dreamer_config.perf.static_pad=false
      - algorithm.dreamer_config.perf.dedup_value=false
      - algorithm.dreamer_config.perf.cudnn_benchmark=false
      - algorithm.dreamer_config.perf.tf32=false
      - algorithm.dreamer_config.perf.foreach_laprop=false
      - algorithm.dreamer_config.perf.channels_last=false
      - algorithm.buffer_config.pin_memory=false
      - algorithm.buffer_config.storage_device=cuda

  batch32:
    label: "Replay batch 32"
    axis: network
    seeds: [1, 2, 3, 4, 5]
    # The replay batch is not a pure runtime knob: it changes the gradient and
    # would need the learning rate rescaled to stay comparable. Measured, not
    # recommended.
    semantics_preserving: false
    # DECLARED BUT NOT RUN. Out of memory with every memory-saving knob off:
    # it died on both the RTX 3090 (24 GB) and the RTX 5090 (32 GB) hosts.
    enabled: false
    experiment: dreamer/atari100k
    overrides:
      - exp_name=dreamer_ablation_batch32
      - algorithm.dreamer_config.compile=false
      - algorithm.dreamer_config.perf.amp=off
      - algorithm.dreamer_config.perf.static_pad=false
      - algorithm.dreamer_config.perf.dedup_value=false
      - algorithm.dreamer_config.perf.cudnn_benchmark=false
      - algorithm.dreamer_config.perf.tf32=false
      - algorithm.dreamer_config.perf.foreach_laprop=false
      - algorithm.dreamer_config.perf.channels_last=false
      - algorithm.buffer_config.pin_memory=false
      - algorithm.buffer_config.batch_size=32

  batch8:
    label: "Replay batch 8"
    axis: network
    seeds: [1, 2, 3, 4, 5]
    semantics_preserving: false
    experiment: dreamer/atari100k
    overrides:
      - exp_name=dreamer_ablation_batch8
      - algorithm.dreamer_config.compile=false
      - algorithm.dreamer_config.perf.amp=off
      - algorithm.dreamer_config.perf.static_pad=false
      - algorithm.dreamer_config.perf.dedup_value=false
      - algorithm.dreamer_config.perf.cudnn_benchmark=false
      - algorithm.dreamer_config.perf.tf32=false
      - algorithm.dreamer_config.perf.foreach_laprop=false
      - algorithm.dreamer_config.perf.channels_last=false
      - algorithm.buffer_config.pin_memory=false
      - algorithm.buffer_config.batch_size=8

  train_ratio512:
    label: "Train ratio 512"
    axis: data
    seeds: [1, 2, 3, 4, 5]
    semantics_preserving: false
    # DECLARED BUT NOT RUN. `train_ratio` is replayed frames per env step, so
    # 512 is 4x the committed 128 and roughly 4x the baseline's runtime — half
    # the sweep again, for a row whose cost is not in doubt. Recorded here
    # rather than left to prose, so the file says what was skipped. To run it:
    # `--only baseline,train_ratio512`, which overrides the flag.
    enabled: false
    experiment: dreamer/atari100k
    overrides:
      - exp_name=dreamer_ablation_train_ratio512
      - algorithm.dreamer_config.compile=false
      - algorithm.dreamer_config.perf.amp=off
      - algorithm.dreamer_config.perf.static_pad=false
      - algorithm.dreamer_config.perf.dedup_value=false
      - algorithm.dreamer_config.perf.cudnn_benchmark=false
      - algorithm.dreamer_config.perf.tf32=false
      - algorithm.dreamer_config.perf.foreach_laprop=false
      - algorithm.dreamer_config.perf.channels_last=false
      - algorithm.buffer_config.pin_memory=false
      - algorithm.train_ratio=512

  combined:
    label: "Combined (best tweaks on)"
    axis: ""
    semantics_preserving: true
    enabled: true
    seeds: [1, 2, 3, 4, 5]
    experiment: dreamer/atari100k
    overrides:
      - exp_name=dreamer_ablation_combined
      - algorithm.dreamer_config.compile=max-autotune
      - algorithm.dreamer_config.perf.amp=bf16
      - algorithm.dreamer_config.perf.static_pad=false
      - algorithm.dreamer_config.perf.dedup_value=false
      - algorithm.dreamer_config.perf.cudnn_benchmark=true
      - algorithm.dreamer_config.perf.tf32=true
      - algorithm.dreamer_config.perf.foreach_laprop=false
      - algorithm.dreamer_config.perf.channels_last=true
      - algorithm.buffer_config.pin_memory=true
