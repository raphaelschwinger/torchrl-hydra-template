# PPO on DMC100k (state obs; 100k env steps = 50k agent steps at action
# repeat 2), cleanRL ppo_continuous_action.py hyperparameters, the six tasks of
# the SAC / BRO / TD-MPC2 port checks, 3 seeds. References at 100k env steps:
# see src/algorithms/ppo/README.md (DMC100k section).
#
#   ./scripts/run_sweep.sh --sweep scripts/sweeps/ppo_dmc100k_val.yaml --gpus 0,1,2
common:
  tag: ppo-dmc100k-val
  seeds:
  - 1
  - 2
  - 3
  total_frames: 50000
  overrides:
  - trainer.num_envs=1
  - trainer.log_every_n_steps=1000
  - checkpoint.save_every_n_steps=0
  smoke_overrides:
  - trainer.total_frames=4096
  - evaluation.every_n_steps=0
  - evaluation.final_num_episodes=1
  - trainer.log_every_n_steps=50
runs:
  ppo_cheetah-run:
    experiment: ppo/dmc100k
    overrides:
    - exp_name=ppo_verify
    - environment.task=cheetah-run
  ppo_walker-walk:
    experiment: ppo/dmc100k
    overrides:
    - exp_name=ppo_verify
    - environment.task=walker-walk
  ppo_finger-spin:
    experiment: ppo/dmc100k
    overrides:
    - exp_name=ppo_verify
    - environment.task=finger-spin
  ppo_reacher-easy:
    experiment: ppo/dmc100k
    overrides:
    - exp_name=ppo_verify
    - environment.task=reacher-easy
  ppo_quadruped-walk:
    experiment: ppo/dmc100k
    overrides:
    - exp_name=ppo_verify
    - environment.task=quadruped-walk
  ppo_cartpole-swingup:
    experiment: ppo/dmc100k
    overrides:
    - exp_name=ppo_verify
    - environment.task=cartpole-swingup
