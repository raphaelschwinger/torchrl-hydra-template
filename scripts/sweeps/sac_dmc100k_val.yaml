# SAC port check on DMC100k (state obs; 100k env steps = 50k agent steps at
# action repeat 2), jaxrl defaults, six tasks across six domains, 3 seeds.
# Compare per task with the SAC reruns at 100k env steps by the TD-MPC2, SimBa
# and SimbaV2 authors (FastRL paper repo: data/external/dmc/scores_per_seed.csv).
#
#   ./scripts/run_sweep.sh --sweep scripts/sweeps/sac_dmc100k_val.yaml --gpus 0,1,2,3
common:
  tag: sac-dmc100k-val
  seeds:
  - 1
  - 2
  - 3
  total_frames: 50000
  overrides:
  - trainer.num_envs=1
  - trainer.log_every_n_steps=1000
  - checkpoint.save_every_n_steps=0
  smoke_overrides:
  - trainer.total_frames=300
  - evaluation.every_n_steps=0
  - evaluation.final_num_episodes=1
  - trainer.log_every_n_steps=50
runs:
  sac_cheetah-run:
    experiment: sac/dmc
    overrides:
    - exp_name=sac_verify
    - environment.task=cheetah-run
    smoke_overrides:
    - algorithm.init_random_frames=100
  sac_walker-walk:
    experiment: sac/dmc
    overrides:
    - exp_name=sac_verify
    - environment.task=walker-walk
    smoke_overrides:
    - algorithm.init_random_frames=100
  sac_finger-spin:
    experiment: sac/dmc
    overrides:
    - exp_name=sac_verify
    - environment.task=finger-spin
    smoke_overrides:
    - algorithm.init_random_frames=100
  sac_reacher-easy:
    experiment: sac/dmc
    overrides:
    - exp_name=sac_verify
    - environment.task=reacher-easy
    smoke_overrides:
    - algorithm.init_random_frames=100
  sac_quadruped-walk:
    experiment: sac/dmc
    overrides:
    - exp_name=sac_verify
    - environment.task=quadruped-walk
    smoke_overrides:
    - algorithm.init_random_frames=100
  sac_cartpole-swingup:
    experiment: sac/dmc
    overrides:
    - exp_name=sac_verify
    - environment.task=cartpole-swingup
    smoke_overrides:
    - algorithm.init_random_frames=100
