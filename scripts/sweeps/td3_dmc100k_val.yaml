# TD3 port check on DMC100k (state obs; 100k env steps = 50k agent steps at
# action repeat 2), Fujimoto's defaults with sac/dmc's 5k warm-up, the six
# tasks of the SAC / BRO / TD-MPC2 port checks, 3 seeds. References: see
# src/algorithms/td3/README.md (no published TD3 run at DMC100k exists; TD7
# and SAC reruns are the nearest).
#
#   ./scripts/run_sweep.sh --sweep scripts/sweeps/td3_dmc100k_val.yaml --gpus 3,4,5
common:
  tag: td3-dmc100k-val
  seeds:
  - 1
  - 2
  - 3
  total_frames: 50000
  overrides:
  - trainer.num_envs=1
  - trainer.log_every_n_steps=1000
  - checkpoint.save_every_n_steps=0
  smoke_overrides:
  - trainer.total_frames=300
  - evaluation.every_n_steps=0
  - evaluation.final_num_episodes=1
  - trainer.log_every_n_steps=50
runs:
  td3_cheetah-run:
    experiment: td3/dmc
    overrides:
    - exp_name=td3_verify
    - environment.task=cheetah-run
    smoke_overrides:
    - algorithm.init_random_frames=100
  td3_walker-walk:
    experiment: td3/dmc
    overrides:
    - exp_name=td3_verify
    - environment.task=walker-walk
    smoke_overrides:
    - algorithm.init_random_frames=100
  td3_finger-spin:
    experiment: td3/dmc
    overrides:
    - exp_name=td3_verify
    - environment.task=finger-spin
    smoke_overrides:
    - algorithm.init_random_frames=100
  td3_reacher-easy:
    experiment: td3/dmc
    overrides:
    - exp_name=td3_verify
    - environment.task=reacher-easy
    smoke_overrides:
    - algorithm.init_random_frames=100
  td3_quadruped-walk:
    experiment: td3/dmc
    overrides:
    - exp_name=td3_verify
    - environment.task=quadruped-walk
    smoke_overrides:
    - algorithm.init_random_frames=100
  td3_cartpole-swingup:
    experiment: td3/dmc
    overrides:
    - exp_name=td3_verify
    - environment.task=cartpole-swingup
    smoke_overrides:
    - algorithm.init_random_frames=100
