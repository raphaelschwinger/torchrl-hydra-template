# TD-MPC2 port check on DMC100k (state obs; 100k env steps = 50k agent steps
# at action repeat 2), published settings, six tasks across six domains, 3 seeds.
# Compare per task with TD-MPC2's own per-seed scores at 100k env steps
# (FastRL paper repo: data/external/dmc/scores_per_seed.csv, from
# github.com/nicklashansen/tdmpc2 results/).
#
#   ./scripts/run_sweep.sh --sweep scripts/sweeps/tdmpc2_dmc100k_val.yaml --gpus 0,1,2,3
common:
  tag: tdmpc2-dmc100k-val
  seeds:
  - 1
  - 2
  - 3
  total_frames: 50000
  overrides:
  - trainer.num_envs=1
  - trainer.log_every_n_steps=1000
  - checkpoint.save_every_n_steps=0
  smoke_overrides:
  - trainer.total_frames=300
  - evaluation.every_n_steps=0
  - evaluation.final_num_episodes=1
  - trainer.log_every_n_steps=50
runs:
  tdmpc2_cheetah-run:
    experiment: tdmpc2/dmc
    overrides:
    - exp_name=tdmpc2_verify
    - environment.task=cheetah-run
    smoke_overrides:
    - algorithm.init_random_frames=100
    - algorithm.pretrain_updates=5
    - algorithm.num_updates=2
    - algorithm.compile=false
  tdmpc2_walker-walk:
    experiment: tdmpc2/dmc
    overrides:
    - exp_name=tdmpc2_verify
    - environment.task=walker-walk
    smoke_overrides:
    - algorithm.init_random_frames=100
    - algorithm.pretrain_updates=5
    - algorithm.num_updates=2
    - algorithm.compile=false
  tdmpc2_finger-spin:
    experiment: tdmpc2/dmc
    overrides:
    - exp_name=tdmpc2_verify
    - environment.task=finger-spin
    smoke_overrides:
    - algorithm.init_random_frames=100
    - algorithm.pretrain_updates=5
    - algorithm.num_updates=2
    - algorithm.compile=false
  tdmpc2_reacher-easy:
    experiment: tdmpc2/dmc
    overrides:
    - exp_name=tdmpc2_verify
    - environment.task=reacher-easy
    smoke_overrides:
    - algorithm.init_random_frames=100
    - algorithm.pretrain_updates=5
    - algorithm.num_updates=2
    - algorithm.compile=false
  tdmpc2_quadruped-walk:
    experiment: tdmpc2/dmc
    overrides:
    - exp_name=tdmpc2_verify
    - environment.task=quadruped-walk
    smoke_overrides:
    - algorithm.init_random_frames=100
    - algorithm.pretrain_updates=5
    - algorithm.num_updates=2
    - algorithm.compile=false
  tdmpc2_cartpole-swingup:
    experiment: tdmpc2/dmc
    overrides:
    - exp_name=tdmpc2_verify
    - environment.task=cartpole-swingup
    smoke_overrides:
    - algorithm.init_random_frames=100
    - algorithm.pretrain_updates=5
    - algorithm.num_updates=2
    - algorithm.compile=false
