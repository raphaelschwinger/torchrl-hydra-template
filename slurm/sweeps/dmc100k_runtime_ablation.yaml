# Runtime-improvement ablation for BRO (learner-bound, UTD 10) and TD-MPC2
# (actor-bound, MPPI planning every step) on DMC100k, the DMC counterpart of
# scripts/sweeps/{bbf,dreamer}_optimisations_ablation.yaml.
#
# BASELINE IS EVERYTHING OFF (the published code path). Every row spells out
# every runtime flag, and each single-tweak row switches exactly one on.
# Pure-runtime rows run on the validation task finger-turn_easy; rows whose
# claim is about SCORE (`semantics_preserving: false`) plus `baseline` and
# `combined` run on both validation tasks (finger-turn_easy, quadruped-walk).
# No test task appears here. Three seeds everywhere, so each timing is a mean
# with a spread (repeat-timing critique).
#
# MEASURED: one GPU type for every cell, or the timings do not compare:
#   slurm/submit.sh --sweep slurm/sweeps/dmc100k_runtime_ablation.yaml --gres gpu:rtx_pro_6000:1
# Wall-clock per run: the ===== start/done stamps in each log, or W&B _runtime.
# Evaluation stays at the dmc protocol (10 episodes every 10k agent steps)
# in every row, so it is a constant cost, reported separately by the profile.

common:
  tag: dmc100k-runtime
  seeds: [1, 2, 3]
  total_frames: 50_000
  overrides:
    - trainer.num_envs=1
    - trainer.log_every_n_steps=1000
    - checkpoint.enabled=false
  smoke_overrides:
    - trainer.total_frames=300
    - evaluation.every_n_steps=0
    - evaluation.final_num_episodes=1
    - trainer.log_every_n_steps=50
    - algorithm.init_random_frames=100

runs:
  bro_baseline_finger-turn_easy:
    label: "Baseline (published BRO, UTD 10)"
    axis: ""
    semantics_preserving: true
    experiment: bro/dmc
    overrides:
      - exp_name=bro_runtime_baseline
      - environment.task=finger-turn_easy
      - algorithm.compile=false
      - algorithm.compile_scope=update
      - algorithm.amp=false
      - algorithm.tf32=false
      - algorithm.fused_optim=false
      - algorithm.buffer_device=cpu
  bro_baseline_quadruped-walk:
    label: "Baseline (published BRO, UTD 10)"
    axis: ""
    semantics_preserving: true
    experiment: bro/dmc
    overrides:
      - exp_name=bro_runtime_baseline
      - environment.task=quadruped-walk
      - algorithm.compile=false
      - algorithm.compile_scope=update
      - algorithm.amp=false
      - algorithm.tf32=false
      - algorithm.fused_optim=false
      - algorithm.buffer_device=cpu
  bro_compile_finger-turn_easy:
    label: "torch.compile (default mode, per update)"
    axis: "network"
    semantics_preserving: true
    experiment: bro/dmc
    overrides:
      - exp_name=bro_runtime_compile
      - environment.task=finger-turn_easy
      - algorithm.compile=true
      - algorithm.compile_scope=update
      - algorithm.amp=false
      - algorithm.tf32=false
      - algorithm.fused_optim=false
      - algorithm.buffer_device=cpu
  bro_cudagraphs_finger-turn_easy:
    label: "torch.compile reduce-overhead (CUDA graph per update)"
    axis: "network"
    semantics_preserving: true
    experiment: bro/dmc
    overrides:
      - exp_name=bro_runtime_cudagraphs
      - environment.task=finger-turn_easy
      - algorithm.compile=reduce-overhead
      - algorithm.compile_scope=update
      - algorithm.amp=false
      - algorithm.tf32=false
      - algorithm.fused_optim=false
      - algorithm.buffer_device=cpu
  bro_cudagraphs_step_finger-turn_easy:
    label: "CUDA graph per agent step (all 10 updates)"
    axis: "network"
    semantics_preserving: true
    experiment: bro/dmc
    overrides:
      - exp_name=bro_runtime_cudagraphs_step
      - environment.task=finger-turn_easy
      - algorithm.compile=reduce-overhead
      - algorithm.compile_scope=step
      - algorithm.amp=false
      - algorithm.tf32=false
      - algorithm.fused_optim=false
      - algorithm.buffer_device=cpu
  bro_amp_finger-turn_easy:
    label: "Mixed precision (bf16)"
    axis: "network"
    semantics_preserving: false
    experiment: bro/dmc
    overrides:
      - exp_name=bro_runtime_amp
      - environment.task=finger-turn_easy
      - algorithm.compile=false
      - algorithm.compile_scope=update
      - algorithm.amp=true
      - algorithm.tf32=false
      - algorithm.fused_optim=false
      - algorithm.buffer_device=cpu
  bro_amp_quadruped-walk:
    label: "Mixed precision (bf16)"
    axis: "network"
    semantics_preserving: false
    experiment: bro/dmc
    overrides:
      - exp_name=bro_runtime_amp
      - environment.task=quadruped-walk
      - algorithm.compile=false
      - algorithm.compile_scope=update
      - algorithm.amp=true
      - algorithm.tf32=false
      - algorithm.fused_optim=false
      - algorithm.buffer_device=cpu
  bro_tf32_finger-turn_easy:
    label: "TF32 matmuls"
    axis: "network"
    semantics_preserving: true
    experiment: bro/dmc
    overrides:
      - exp_name=bro_runtime_tf32
      - environment.task=finger-turn_easy
      - algorithm.compile=false
      - algorithm.compile_scope=update
      - algorithm.amp=false
      - algorithm.tf32=true
      - algorithm.fused_optim=false
      - algorithm.buffer_device=cpu
  bro_fused_optim_finger-turn_easy:
    label: "Fused AdamW"
    axis: "network"
    semantics_preserving: true
    experiment: bro/dmc
    overrides:
      - exp_name=bro_runtime_fused_optim
      - environment.task=finger-turn_easy
      - algorithm.compile=false
      - algorithm.compile_scope=update
      - algorithm.amp=false
      - algorithm.tf32=false
      - algorithm.fused_optim=true
      - algorithm.buffer_device=cpu
  bro_gpu_replay_finger-turn_easy:
    label: "GPU-resident replay"
    axis: "data"
    semantics_preserving: true
    experiment: bro/dmc
    overrides:
      - exp_name=bro_runtime_gpu_replay
      - environment.task=finger-turn_easy
      - algorithm.compile=false
      - algorithm.compile_scope=update
      - algorithm.amp=false
      - algorithm.tf32=false
      - algorithm.fused_optim=false
      - algorithm.buffer_device=cuda
  bro_combined_finger-turn_easy:
    label: "Combined (CUDA graph per step, TF32, fused AdamW, GPU replay)"
    axis: "combined"
    semantics_preserving: true
    experiment: bro/dmc
    overrides:
      - exp_name=bro_runtime_combined
      - environment.task=finger-turn_easy
      - algorithm.compile=reduce-overhead
      - algorithm.compile_scope=step
      - algorithm.amp=false
      - algorithm.tf32=true
      - algorithm.fused_optim=true
      - algorithm.buffer_device=cuda
  bro_combined_quadruped-walk:
    label: "Combined (CUDA graph per step, TF32, fused AdamW, GPU replay)"
    axis: "combined"
    semantics_preserving: true
    experiment: bro/dmc
    overrides:
      - exp_name=bro_runtime_combined
      - environment.task=quadruped-walk
      - algorithm.compile=reduce-overhead
      - algorithm.compile_scope=step
      - algorithm.amp=false
      - algorithm.tf32=true
      - algorithm.fused_optim=true
      - algorithm.buffer_device=cuda
  bro_combined_amp_finger-turn_easy:
    label: "Combined + bf16"
    axis: "combined"
    semantics_preserving: false
    experiment: bro/dmc
    overrides:
      - exp_name=bro_runtime_combined_amp
      - environment.task=finger-turn_easy
      - algorithm.compile=reduce-overhead
      - algorithm.compile_scope=step
      - algorithm.amp=true
      - algorithm.tf32=true
      - algorithm.fused_optim=true
      - algorithm.buffer_device=cuda
  bro_combined_amp_quadruped-walk:
    label: "Combined + bf16"
    axis: "combined"
    semantics_preserving: false
    experiment: bro/dmc
    overrides:
      - exp_name=bro_runtime_combined_amp
      - environment.task=quadruped-walk
      - algorithm.compile=reduce-overhead
      - algorithm.compile_scope=step
      - algorithm.amp=true
      - algorithm.tf32=true
      - algorithm.fused_optim=true
      - algorithm.buffer_device=cuda
  tdmpc2_baseline_finger-turn_easy:
    label: "Baseline (TD-MPC2, compile off)"
    axis: ""
    semantics_preserving: true
    experiment: tdmpc2/dmc
    overrides:
      - exp_name=tdmpc2_runtime_baseline
      - environment.task=finger-turn_easy
      - algorithm.compile=false
      - algorithm.tf32=false
      - algorithm.buffer_device=cpu
    smoke_overrides: [algorithm.pretrain_updates=5, algorithm.num_updates=2]
  tdmpc2_baseline_quadruped-walk:
    label: "Baseline (TD-MPC2, compile off)"
    axis: ""
    semantics_preserving: true
    experiment: tdmpc2/dmc
    overrides:
      - exp_name=tdmpc2_runtime_baseline
      - environment.task=quadruped-walk
      - algorithm.compile=false
      - algorithm.tf32=false
      - algorithm.buffer_device=cpu
    smoke_overrides: [algorithm.pretrain_updates=5, algorithm.num_updates=2]
  tdmpc2_compile_finger-turn_easy:
    label: "torch.compile reduce-overhead (upstream GPU default)"
    axis: "network"
    semantics_preserving: true
    experiment: tdmpc2/dmc
    overrides:
      - exp_name=tdmpc2_runtime_compile
      - environment.task=finger-turn_easy
      - algorithm.compile=true
      - algorithm.tf32=false
      - algorithm.buffer_device=cpu
    smoke_overrides: [algorithm.pretrain_updates=5, algorithm.num_updates=2]
  tdmpc2_tf32_finger-turn_easy:
    label: "TF32 matmuls"
    axis: "network"
    semantics_preserving: true
    experiment: tdmpc2/dmc
    overrides:
      - exp_name=tdmpc2_runtime_tf32
      - environment.task=finger-turn_easy
      - algorithm.compile=false
      - algorithm.tf32=true
      - algorithm.buffer_device=cpu
    smoke_overrides: [algorithm.pretrain_updates=5, algorithm.num_updates=2]
  tdmpc2_gpu_replay_finger-turn_easy:
    label: "GPU-resident replay"
    axis: "data"
    semantics_preserving: true
    experiment: tdmpc2/dmc
    overrides:
      - exp_name=tdmpc2_runtime_gpu_replay
      - environment.task=finger-turn_easy
      - algorithm.compile=false
      - algorithm.tf32=false
      - algorithm.buffer_device=cuda
    smoke_overrides: [algorithm.pretrain_updates=5, algorithm.num_updates=2]
  tdmpc2_combined_finger-turn_easy:
    label: "Combined (compile, TF32, GPU replay)"
    axis: "combined"
    semantics_preserving: true
    experiment: tdmpc2/dmc
    overrides:
      - exp_name=tdmpc2_runtime_combined
      - environment.task=finger-turn_easy
      - algorithm.compile=true
      - algorithm.tf32=true
      - algorithm.buffer_device=cuda
    smoke_overrides: [algorithm.pretrain_updates=5, algorithm.num_updates=2]
  tdmpc2_combined_quadruped-walk:
    label: "Combined (compile, TF32, GPU replay)"
    axis: "combined"
    semantics_preserving: true
    experiment: tdmpc2/dmc
    overrides:
      - exp_name=tdmpc2_runtime_combined
      - environment.task=quadruped-walk
      - algorithm.compile=true
      - algorithm.tf32=true
      - algorithm.buffer_device=cuda
    smoke_overrides: [algorithm.pretrain_updates=5, algorithm.num_updates=2]
